<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Button Box EN57</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 90%;
            max-width: 700px;
            margin: 60px auto;
            background: #1c1c1c;
            padding: 30px;
            border-radius: 15px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        p {
            text-align: center;
            color: #aaa;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            border: 0;
            border-radius: 8px;
            background: #247cff;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #1267e8;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            background: #292929;
            border-radius: 8px;
            text-align: center;
        }

        #log {
            margin-top: 20px;
            background: #080808;
            border-radius: 8px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Button Box EN57</h1>

    <p>Konfigurator Button Box</p>

    <button id="connect">
        POŁĄCZ Z BUTTON BOX
    </button>

    <div id="status">
        Status: niepołączono
    </div>

    <div id="log"></div>

</div>

<script>

let port = null;

const connectButton = document.getElementById("connect");
const statusBox = document.getElementById("status");
const logBox = document.getElementById("log");

function log(text) {
    logBox.textContent += text + "\n";
    logBox.scrollTop = logBox.scrollHeight;
}

async function connect() {

    log("Kliknięto POŁĄCZ.");

    if (!("serial" in navigator)) {

        log("BŁĄD: Web Serial nie jest dostępny.");

        alert(
            "Web Serial nie jest dostępny.\n\n" +
            "Otwórz stronę w Google Chrome lub Microsoft Edge."
        );

        return;
    }

    log("Web Serial jest dostępny.");

    try {

        log("Otwieram wybór portu...");

        port = await navigator.serial.requestPort();

        log("Wybrano urządzenie.");

        statusBox.textContent = "Status: otwieranie portu...";

        await port.open({
            baudRate: 115200
        });

        log("Port został otwarty.");

        statusBox.textContent = "Status: POŁĄCZONO";

        connectButton.textContent = "ROZŁĄCZ";

        log("Wysyłam GET...");

        const writer = port.writable.getWriter();

        const encoder = new TextEncoder();

        await writer.write(
            encoder.encode("GET\n")
        );

        writer.releaseLock();

        log("GET wysłane.");

        startReading();

    } catch (error) {

        log("BŁĄD:");
        log(error.message);

        console.error(error);

        statusBox.textContent = "Status: błąd";

        port = null;
    }
}

async function startReading() {

    if (!port) {
        return;
    }

    if (!port.readable) {
        log("Port nie pozwala na odczyt.");
        return;
    }

    const reader = port.readable.getReader();

    const decoder = new TextDecoder();

    log("Nasłuchiwanie danych...");

    try {

        while (true) {

            const result = await reader.read();

            if (result.done) {
                break;
            }

            const text = decoder.decode(result.value);

            log("RX: " + text);
        }

    } catch (error) {

        log("Błąd odczytu: " + error.message);

    } finally {

        reader.releaseLock();
    }
}

async function disconnect() {

    if (!port) {
        return;
    }

    try {

        await port.close();

        log("Port zamknięty.");

    } catch (error) {

        log("Błąd zamykania: " + error.message);
    }

    port = null;

    statusBox.textContent = "Status: niepołączono";

    connectButton.textContent = "POŁĄCZ Z BUTTON BOX";
}

connectButton.addEventListener("click", async function() {

    if (port) {

        await disconnect();

    } else {

        await connect();

    }

});

log("Strona uruchomiona.");

if ("serial" in navigator) {

    log("Web Serial: OK");

} else {

    log("Web Serial: BRAK");
}

</script>

</body>
</html>
