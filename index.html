<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Box EN57</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111318;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 50px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
        }

        .panel {
            background: #1b1e25;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 20px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 15px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #444;
            cursor: not-allowed;
        }

        #connectButton {
            width: 100%;
            font-size: 17px;
            padding: 15px;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #252932;
            color: #aaa;
            text-align: center;
        }

        .status.connected {
            color: #4ade80;
        }

        .settings {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .setting {
            background: #252932;
            padding: 15px;
            border-radius: 10px;
        }

        .setting label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
        }

        .row {
            display: flex;
            gap: 8px;
        }

        input {
            width: 100%;
            background: #111318;
            color: white;
            border: 1px solid #444;
            border-radius: 7px;
            padding: 10px;
            font-size: 16px;
        }

        input:disabled {
            opacity: 0.5;
        }

        .capture {
            white-space: nowrap;
        }

        .bottom-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .bottom-buttons button {
            flex: 1;
        }

        #saveButton {
            background: #16a34a;
        }

        #saveButton:hover {
            background: #15803d;
        }

        .console {
            background: #090a0c;
            border-radius: 8px;
            padding: 15px;
            height: 180px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            color: #aaa;
        }

        @media (max-width: 650px) {
            .settings {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Button Box EN57</h1>

    <div class="subtitle">
        Konfigurator przycisków
    </div>

    <div class="panel">

        <button id="connectButton">
            Połącz z Button Box
        </button>

        <div id="status" class="status">
            Niepołączono
        </div>

    </div>

    <div class="panel">

        <h2>Ustawienia przycisków</h2>

        <div class="settings">

            <div class="setting">
                <label>Lewo góra</label>
                <div class="row">
                    <input id="leftUp" disabled>
                    <button class="capture" data-field="leftUp" disabled>Wybierz</button>
                </div>
            </div>

            <div class="setting">
                <label>Lewo dół</label>
                <div class="row">
                    <input id="leftDown" disabled>
                    <button class="capture" data-field="leftDown" disabled>Wybierz</button>
                </div>
            </div>

            <div class="setting">
                <label>Prawo góra</label>
                <div class="row">
                    <input id="rightUp" disabled>
                    <button class="capture" data-field="rightUp" disabled>Wybierz</button>
                </div>
            </div>

            <div class="setting">
                <label>Prawo dół</label>
                <div class="row">
                    <input id="rightDown" disabled>
                    <button class="capture" data-field="rightDown" disabled>Wybierz</button>
                </div>
            </div>

            <div class="setting">
                <label>Środkowy</label>
                <div class="row">
                    <input id="mid" disabled>
                    <button class="capture" data-field="mid" disabled>Wybierz</button>
                </div>
            </div>

            <div class="setting">
                <label>Czuwak</label>
                <div class="row">
                    <input id="czuwak" disabled>
                    <button class="capture" data-field="czuwak" disabled>Wybierz</button>
                </div>
            </div>

        </div>

        <div class="bottom-buttons">
            <button id="saveButton" disabled>
                Zapisz ustawienia
            </button>
        </div>

    </div>

    <div class="panel">

        <h2>Serial</h2>

        <div id="console" class="console"></div>

    </div>

</div>

<script>

let port = null;
let reader = null;
let keepReading = false;

const connectButton = document.getElementById("connectButton");
const status = document.getElementById("status");
const saveButton = document.getElementById("saveButton");
const consoleBox = document.getElementById("console");

const fields = [
    "leftUp",
    "leftDown",
    "rightUp",
    "rightDown",
    "mid",
    "czuwak"
];

function log(text) {
    const line = document.createElement("div");
    line.textContent = "> " + text;
    consoleBox.appendChild(line);
    consoleBox.scrollTop = consoleBox.scrollHeight;
}

function setConnected(connected) {

    const buttons = document.querySelectorAll(".capture");

    buttons.forEach(button => {
        button.disabled = !connected;
    });

    fields.forEach(id => {
        document.getElementById(id).disabled = !connected;
    });

    saveButton.disabled = !connected;
}

function setStatus(text, connected = false) {

    status.textContent = text;

    if (connected) {
        status.classList.add("connected");
    } else {
        status.classList.remove("connected");
    }
}

async function connectButtonBox() {

    log("Kliknięto przycisk połączenia.");

    if (!("serial" in navigator)) {

        alert(
            "Ta przeglądarka nie obsługuje Web Serial.\n\n" +
            "Użyj najnowszego Google Chrome albo Microsoft Edge."
        );

        log("Brak Web Serial.");
        return;
    }

    try {

        if (port) {
            await disconnectButtonBox();
            return;
        }

        log("Otwieranie wyboru portu...");

        port = await navigator.serial.requestPort();

        log("Wybrano port.");

        await port.open({
            baudRate: 115200
        });

        log("Port otwarty.");

        connectButton.textContent = "Rozłącz z Button Box";

        setStatus("Połączono z Button Box", true);

        setConnected(true);

        keepReading = true;

        readSerial();

        await sendCommand("GET");

    } catch (error) {

        log("BŁĄD: " + error.message);

        console.error(error);

        if (port) {
            try {
                await port.close();
            } catch (e) {}
        }

        port = null;

        setConnected(false);

        setStatus("Niepołączono");

        connectButton.textContent = "Połącz z Button Box";
    }
}

async function readSerial() {

    if (!port || !port.readable) {
        return;
    }

    reader = port.readable.getReader();

    const decoder = new TextDecoder();

    try {

        while (keepReading) {

            const result = await reader.read();

            if (result.done) {
                break;
            }

            if (result.value) {

                const text = decoder.decode(result.value);

                const lines = text.split(/\r?\n/);

                lines.forEach(line => {

                    line = line.trim();

                    if (line.length > 0) {

                        log("RX: " + line);

                        parseSerial(line);
                    }

                });
            }
        }

    } catch (error) {

        log("Błąd odczytu: " + error.message);

    } finally {

        try {
            reader.releaseLock();
        } catch (e) {}

        reader = null;
    }
}

function parseSerial(line) {

    if (line.startsWith("LEFT_UP=")) {
        document.getElementById("leftUp").value =
            line.substring("LEFT_UP=".length);
    }

    else if (line.startsWith("LEFT_DOWN=")) {
        document.getElementById("leftDown").value =
            line.substring("LEFT_DOWN=".length);
    }

    else if (line.startsWith("RIGHT_UP=")) {
        document.getElementById("rightUp").value =
            line.substring("RIGHT_UP=".length);
    }

    else if (line.startsWith("RIGHT_DOWN=")) {
        document.getElementById("rightDown").value =
            line.substring("RIGHT_DOWN=".length);
    }

    else if (line.startsWith("MID=")) {
        document.getElementById("mid").value =
            line.substring("MID=".length);
    }

    else if (line.startsWith("CZUWAK=")) {
        document.getElementById("czuwak").value =
            line.substring("CZUWAK=".length);
    }
}

async function sendCommand(command) {

    if (!port || !port.writable) {

        log("Nie można wysłać - brak połączenia.");

        return;
    }

    const writer = port.writable.getWriter();

    try {

        log("TX: " + command);

        const encoder = new TextEncoder();

        await writer.write(
            encoder.encode(command + "\n")
        );

    } finally {

        writer.releaseLock();
    }
}

async function saveSettings() {

    if (!port) {
        return;
    }

    log("Zapisywanie ustawień...");

    await sendCommand(
        "SET LEFT_UP=" +
        document.getElementById("leftUp").value
    );

    await sendCommand(
        "SET LEFT_DOWN=" +
        document.getElementById("leftDown").value
    );

    await sendCommand(
        "SET RIGHT_UP=" +
        document.getElementById("rightUp").value
    );

    await sendCommand(
        "SET RIGHT_DOWN=" +
        document.getElementById("rightDown").value
    );

    await sendCommand(
        "SET MID=" +
        document.getElementById("mid").value
    );

    await sendCommand(
        "SET CZUWAK=" +
        document.getElementById("czuwak").value
    );

    await sendCommand("SAVE");

    log("Wysłano SAVE.");

    alert("Ustawienia zapisane.");
}

async function disconnectButtonBox() {

    keepReading = false;

    if (reader) {

        try {
            await reader.cancel();
        } catch (e) {}

        try {
            reader.releaseLock();
        } catch (e) {}

        reader = null;
    }

    if (port) {

        try {
            await port.close();
        } catch (e) {}
    }

    port = null;

    setConnected(false);

    setStatus("Niepołączono");

    connectButton.textContent = "Połącz z Button Box";

    log("Rozłączono.");
}

document.querySelectorAll(".capture").forEach(button => {

    button.addEventListener("click", () => {

        const field = button.dataset.field;

        const input = document.getElementById(field);

        input.focus();

        button.textContent = "Naciśnij klawisz...";

        const handler = event => {

            event.preventDefault();

            input.value = event.key;

            button.textContent = "Wybierz";

            document.removeEventListener("keydown", handler);
        };

        document.addEventListener("keydown", handler);
    });
});

connectButton.addEventListener(
    "click",
    connectButtonBox
);

saveButton.addEventListener(
    "click",
    saveSettings
);

log("Konfigurator uruchomiony.");

if (!("serial" in navigator)) {

    log("UWAGA: Web Serial nie jest dostępny w tej przeglądarce.");

} else {

    log("Web Serial jest dostępny.");
}

</script>

</body>
</html>
